<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" />
    <title>404 — zion</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .bg {
        position: fixed;
        inset: -3%;
        z-index: -2;
        background: url("/bg.jpg") center 42% / cover;
        filter: grayscale(1) brightness(0.32) contrast(1.15) blur(2px);
      }
      .vignette {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: radial-gradient(ellipse 75% 70% at 50% 48%, transparent 0%, rgba(0,0,0,.6) 70%, rgba(0,0,0,.94) 100%);
      }
      body::after {
        content: "";
        position: fixed;
        inset: -50%;
        pointer-events: none;
        opacity: 0.11;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        animation: grain 0.9s steps(6) infinite;
      }
      @keyframes grain {
        0% { transform: translate(0,0); } 25% { transform: translate(-4%,3%); }
        50% { transform: translate(3%,-5%); } 75% { transform: translate(-2%,6%); } 100% { transform: translate(0,0); }
      }
      main { width: min(560px, 100%); }
      .kicker {
        display: block;
        margin-bottom: 10px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255,255,255,.55);
      }
      h1 {
        font-size: clamp(110px, 34vw, 200px);
        font-weight: 800;
        line-height: 0.85;
        letter-spacing: -0.06em;
        text-shadow: 0 4px 24px rgba(0,0,0,.7), 0 0 34px rgba(255,255,255,.16);
        animation: glitch 3.2s steps(1) infinite;
      }
      @keyframes glitch {
        0%, 92%, 100% { transform: none; opacity: 1; }
        93% { transform: translate(-4px, 1px) skewX(-6deg); opacity: .85; }
        95% { transform: translate(5px, -1px); opacity: .6; }
        97% { transform: translate(-2px, 0); opacity: 1; }
      }
      .rule {
        height: 1px;
        margin: 18px 0 20px;
        background: linear-gradient(90deg, rgba(255,255,255,.7), rgba(255,255,255,.15) 60%, transparent);
      }
      p { font-size: 17px; font-weight: 700; color: rgba(255,255,255,.85); }
      a {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 52px;
        margin-top: 26px;
        border: 1px solid #fff;
        border-radius: 14px;
        background: #fff;
        color: #000;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        transition: background-color .2s ease, color .2s ease;
      }
      a:hover { background: transparent; color: #fff; }
      a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) {
        body::after, h1 { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="vignette"></div>
    <main>
      <span class="kicker">error — page not found</span>
      <h1>404</h1>
      <div class="rule"></div>
      <p>This page doesn't exist. Or it got ghosted.</p>
      <a href="/">take me home</a>
    </main>
  </body>
</html>
